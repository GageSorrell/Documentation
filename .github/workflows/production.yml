name: Vercel Production

on:
  push:
    branches:
      - Master

permissions:
  contents: read

concurrency:
  group: sorrell-docs-production
  cancel-in-progress: false

jobs:
  production:
    name: Promote verified production release
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and publish generated Documentation workspace
        run: npm run build:website-cli && node Package/CreateWebsite/Distribution/bin.js deploy production --target Documentation
