name: Vercel Rollback

on:
  workflow_dispatch:
    inputs:
      release:
        description: Optional Vercel deployment ID or URL to restore
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back Documentation
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@48.10.2
      - name: Roll back Documentation deployment
        run: |
          if [ -n "${{ inputs.release }}" ]; then
            vercel rollback "${{ inputs.release }}" --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --yes
          else
            vercel rollback --token="$VERCEL_TOKEN" --scope="$VERCEL_ORG_ID" --yes
          fi
