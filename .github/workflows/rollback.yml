name: Vercel Rollback

on:
  workflow_dispatch:
    inputs:
      release:
        description: Optional Vercel deployment ID or URL to restore
        required: false
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Roll back Documentation
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build website CLI
        run: npm run build:website-cli
      - name: Roll back Documentation deployment
        run: |
          if [ -n "${{ inputs.release }}" ]; then
            node Package/CreateWebsite/Distribution/bin.js deploy rollback "${{ inputs.release }}" --target Documentation
          else
            node Package/CreateWebsite/Distribution/bin.js deploy rollback --target Documentation
          fi
