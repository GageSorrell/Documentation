name: API Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - Master

permissions:
  contents: read

jobs:
  snapshot:
    name: Generate and validate API snapshot
    runs-on: ubuntu-latest
    env:
      SORRELL_DOCS_TARGET: ${{ vars.SORRELL_DOCS_TARGET || '.' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build CLI
        run: npm run build --workspace @sorrell/docs-create-website
      - name: Generate API snapshot
        run: node Package/CreateWebsite/Distribution/bin.js api snapshot --target "$SORRELL_DOCS_TARGET"
      - name: Validate API snapshot
        run: node Package/CreateWebsite/Distribution/bin.js api validate --target "$SORRELL_DOCS_TARGET"
