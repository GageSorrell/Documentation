name: API Snapshot

on:
  workflow_dispatch:
  push:
    branches:
      - Master

permissions:
  contents: read

jobs:
  snapshot:
    name: Generate and validate API snapshot
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build CLI
        run: npm run build:website-cli
      - name: Generate API snapshot
        run: npm run api:generate --workspace @sorrell/documentation
      - name: Validate API snapshot
        run: >
          node --input-type=module -e "import { readFile } from 'node:fs/promises';
          import { assertValidApiDataset } from '@sorrell/docs-api-reference';
          const path = 'Documentation/Documentation/Source/data/ApiReference.json';
          assertValidApiDataset(JSON.parse(await readFile(path, 'utf8')));
          console.log('API snapshot is valid.');"
