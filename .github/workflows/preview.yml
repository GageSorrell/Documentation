name: Vercel Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  preview:
    name: Build and deploy preview
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install pinned Vercel CLI
        run: npm install --global vercel@60.0.1
      - name: Build Documentation
        run: npm run build:website-cli && npm run build --workspace @sorrell/documentation
      - name: Pull Vercel project settings
        run: vercel pull --yes --project="$VERCEL_PROJECT_ID" --environment=preview --token="$VERCEL_TOKEN"
      - name: Build Vercel output
        run: vercel build --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"
      - name: Publish preview
        run: vercel deploy --prebuilt --project="$VERCEL_PROJECT_ID" --token="$VERCEL_TOKEN"
